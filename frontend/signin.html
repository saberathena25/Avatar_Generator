<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - AvatarForge</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="brand">
        <a href="index.html">AvatarForge</a>
      </div>
      <div class="nav-links">
        <button class="btn btn-secondary btn-sm" onclick="window.location.href='index.html'">Back to Site</button>
      </div>
    </div>
  </nav>

  <main class="page-container" style="align-items: center; justify-content: center; min-height: 80vh; display: flex;">
    <div class="card card-centered" style="max-width: 450px;">
      <h2 style="margin-bottom: 1rem;">Sign in to AvatarForge</h2>
      <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Create an account to keep a private avatar history on this server.</p>
      <p id="auth-session" class="status-line hidden"></p>
      <form id="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" minlength="3" maxlength="24" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
        </div>
        <p id="auth-error" class="error-banner hidden" role="alert"></p>
        <button id="login-btn" class="btn btn-primary w-100" type="submit">Sign In</button>
        <button id="register-btn" class="btn btn-secondary w-100 mt-4" type="button">Create Account</button>
      </form>
    </div>
  </main>

  <script src="avatar-client.js"></script>
  <script src="script.js"></script>
</body>
</html>
